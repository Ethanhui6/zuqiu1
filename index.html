<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>足球生涯模拟器 V14.0 优雅版 | Football Career Simulator</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <meta property="og:title" content="足球生涯模拟器 V14.0 优雅浅色版">
  <meta property="og:description" content="中国足球版人生重开模拟器 + 优雅 Apple 风格 + 六边形雷达图 + 真实租借/主力角色！">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Apple Header -->
  <header class="app-header glass-panel">
    <div class="brand-logo">
      ⚽ 足球生涯模拟器
    </div>
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="careerTab">🎮 职业主页</button>
      <button class="tab-btn" data-tab="socialTab">📱 懂球圈</button>
      <button class="tab-btn" data-tab="transferTab">💼 转会市场</button>
      <button class="tab-btn" data-tab="lifeTab">🏠 奢华生活</button>
      <button class="tab-btn" data-tab="galleryTab">🏆 成就墙</button>
    </nav>
  </header>

  <!-- Main SPA Layout -->
  <main class="main-dashboard">

    <!-- Left Column: FUT Card & Scouting Report -->
    <aside id="playerCardContainer">
      <!-- FUT Gold Card Rendered Here -->
    </aside>

    <!-- Right Column: Control Views -->
    <section class="controls-panel">

      <!-- View 1: Main Career Dashboard -->
      <div id="careerTab" class="view-content">

        <!-- Header Quick Bar -->
        <div class="glass-panel" style="margin-bottom: 10px; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.8rem; color: var(--text-muted);">🌱 Seed 种子：<strong id="currentSeedText" style="color: var(--apple-blue);">20260801</strong></span>
          <button class="btn-primary" style="padding: 3px 10px; font-size: 0.75rem;" onclick="openWizardModal()">⚙️ 重新捏脸/选人</button>
        </div>

        <!-- Top Status Bar Metrics -->
        <div class="top-status-bar glass-panel">
          <div class="status-card"><span class="label">📅 时间</span><span class="val" id="statusDate">2026年9月</span></div>
          <div class="status-card"><span class="label">🎂 年龄</span><span class="val" id="statusAge">15 岁</span></div>
          <div class="status-card"><span class="label">🛡️ 效力</span><span class="val" id="statusTeam">浙江队</span></div>
          <div class="status-card"><span class="label">👔 阵容角色</span><span class="val" id="statusRole">主力阵容</span></div>
          <div class="status-card"><span class="label">💵 周薪</span><span class="val" id="statusWage">€3,000</span></div>
          <div class="status-card"><span class="label">💰 资产</span><span class="val" id="statusMoney">€50,000</span></div>
          <div class="status-card"><span class="label">🌟 声望</span><span class="val" id="statusFame">10</span></div>
          <div class="status-card"><span class="label">👥 粉丝</span><span class="val" id="statusFans">5,000</span></div>
          <div class="status-card"><span class="label">🇨🇳 国足出场</span><span class="val" id="statusNational">0 场</span></div>
          <div class="status-card">
            <span class="label">⚡ 经验值</span>
            <span class="val" id="statusExp">0/100</span>
            <div class="exp-bar-box"><div id="expBarFill" class="exp-bar-fill" style="width: 0%;"></div></div>
          </div>
        </div>

        <!-- Monthly Event Card (5 Options) -->
        <div id="eventContainer" style="margin-top: 10px;">
          <!-- Event Content -->
        </div>

        <!-- Advance Month Action Box -->
        <div class="glass-panel" style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
          <div>
            <h3 style="color: #1c1c1e; font-size: 1rem;">⏩ 推进时间轴</h3>
            <p style="font-size: 0.78rem; color: var(--text-muted);">模拟下月剧情与转会动态</p>
          </div>
          <button id="advanceMonthBtn" class="btn-primary">⏩ 模拟下个月</button>
        </div>

        <!-- Career History Logs -->
        <div class="glass-panel" style="margin-top: 10px;">
          <h3 style="margin-bottom: 8px; color: #1c1c1e; font-size: 0.98rem;">📜 生涯动向履历 (Career Logs)</h3>
          <div id="logsFeed" class="logs-feed"></div>
        </div>

      </div>

      <!-- View 2: Social Feed Tab -->
      <div id="socialTab" class="view-content" style="display: none;"></div>

      <!-- View 3: Transfer Market Tab -->
      <div id="transferTab" class="view-content" style="display: none;"></div>

      <!-- View 4: Lifestyle Tab -->
      <div id="lifeTab" class="view-content" style="display: none;"></div>

      <!-- View 5: Achievements Gallery Tab -->
      <div id="galleryTab" class="view-content" style="display: none;"></div>

    </section>

  </main>

  <!-- Wizard Modal Container -->
  <div id="wizardContainer"></div>

  <!-- Modals Containers -->
  <div id="rouletteContainer"></div>
  <div id="matchModalContainer"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/data/teams.js"></script>
  <script src="js/data/players.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/data/achievements.js"></script>
  <script src="js/components/radarChart.js"></script>
  <script src="js/components/wizard.js"></script>
  <script src="js/components/avatar3d.js"></script>
  <script src="js/components/playerCard.js"></script>
  <script src="js/components/matchEngine3d.js"></script>
  <script src="js/components/trophyCabinet3d.js"></script>
  <script src="js/components/worldMap.js"></script>
  <script src="js/components/lifeSimulator.js"></script>
  <script src="js/components/socialFeed.js"></script>
  <script src="js/components/secondCareer.js"></script>
  <script src="js/components/achievementGallery.js"></script>
  <script src="js/components/roulette.js"></script>
  <script src="js/components/summaryCard.js"></script>
  <script src="js/engine/transferEngine.js"></script>
  <script src="js/engine/gameEngine.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }
  </script>
</body>
</html>
