<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f4f7f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>绿茵浮沉 V18</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=18.0.0">
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-mark">⚽</div>
    <strong>绿茵浮沉</strong>
    <span>正在载入球员一生</span>
  </div>

  <div id="app" hidden>
    <header id="topbar" class="topbar glass"></header>
    <main id="view" class="view"></main>
    <nav id="nav" class="tabbar glass"></nav>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></section>
  <div id="toast" class="toast"></div>

  <script>
    // 清理旧版本遗留的 Service Worker 与缓存，避免部署后仍显示 V8/V10。
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(list => list.forEach(reg => reg.unregister())).catch(() => {});
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(() => {});
    }
  </script>
  <script src="app.js?v=18.0.0" defer></script>
</body>
</html>
